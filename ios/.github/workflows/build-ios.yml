name: Build iOS App and Simulator for Web

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build for iOS Simulator (Appetize.io / Web Virtual Machine)
        run: |
          mkdir -p build
          xcodebuild -project Pencil2D.xcodeproj -scheme Pencil2D -configuration Debug -sdk iphonesimulator -derivedDataPath build/derivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          cd build/derivedData/Build/Products/Debug-iphonesimulator
          zip -r ../../../../build/Pencil2D-Simulator.app.zip Pencil2D.app
          cd ../../../..

      - name: Build Unsigned IPA for Devices
        run: |
          xcodebuild clean archive -project Pencil2D.xcodeproj -scheme Pencil2D -configuration Release -archivePath build/Pencil2D.xcarchive -destination "generic/platform=iOS" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p build/Payload
          cp -r build/Pencil2D.xcarchive/Products/Applications/Pencil2D.app build/Payload/
          cd build && zip -r Pencil2D.ipa Payload && cd ..

      - name: Upload Appetize.io Simulator Zip
        uses: actions/upload-artifact@v4
        with:
          name: Pencil2D-Simulator-Web
          path: build/Pencil2D-Simulator.app.zip

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pencil2D-iOS-IPA
          path: build/Pencil2D.ipa
